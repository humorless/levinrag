name: Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  lint-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/cache-clojure-deps
        with:
          key-label: 'lint'
      - uses: jdx/mise-action@v4
        with:
          install_args: "babashka cljfmt clj-kondo java clojure"
      - name: Lint, format and bilingual docs
        run: bb fmt-check && bb deps && bb lint-init && bb lint && bb docs:check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/cache-clojure-deps
        with:
          key-label: 'tests'
      - uses: jdx/mise-action@v4
        with:
          install_args: "babashka java clojure"
      - name: Run tests
        run: bb deps && bb test
