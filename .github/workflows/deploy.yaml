name: Deploy

# Manual only until the Kamal deployment exists (SPEC.md §21.1): it needs
# the SSH_PRIVATE_KEY, SERVER_IP, APP_DOMAIN and SESSION_SECRET_KEY secrets.
# Checks run on every push by themselves (checks.yaml). To deploy on push
# again, add `push: branches: [ main ]` back here.
on:
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20
    needs: [ checks ]
    steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: jdx/mise-action@v4
        with:
          install_args: "babashka"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Runtime for cache
        uses: crazy-max/ghaction-github-runtime@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true

      - name: Install kamal
        run: gem install kamal -v 2.3.0

      - name: Build and deploy
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
        run: bb kamal deploy --version=${{ github.sha }}

      - name: Kamal Release
        if: ${{ cancelled() }}
        run: bb kamal lock release
