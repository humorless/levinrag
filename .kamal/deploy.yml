<% require "dotenv"; Dotenv.load(".env") %>

service: hybridrag
image: <%= ENV['REGISTRY_USERNAME'] %>/hybridrag
servers:
  - <%= ENV['SERVER_IP'] %>

proxy:
  ssl: true
  host: <%= ENV['APP_DOMAIN'] %>
  healthcheck:
    path: /api/v1/health/live

registry:
  server: ghcr.io
  username:
    - REGISTRY_USERNAME
  password:
    - REGISTRY_PASSWORD

builder:
  arch: amd64
  remote: ssh://root@<%= ENV['SERVER_IP'] %>
  cache:
    type: gha

env:
  clear:
    # config.edn opens DATA_DIR/index.dtlv and DATA_DIR/app.dtlv (the volume below)
    DATA_DIR: /app/data
    CORPUS_DIR: /app/corpus
  secret:
    - SESSION_SECRET_KEY
    - VLLM_API_KEY
    - VLLM_EMBED_BASE_URL
    - VLLM_EMBED_MODEL
    - VLLM_RERANK_BASE_URL
    - VLLM_RERANK_MODEL
    - VLLM_CHAT_BASE_URL
    - VLLM_CHAT_MODEL

volumes:
  # index.dtlv, app.dtlv (users, tokens, traces) and ingest reports
  - "/root/levinrag/data:/app/data"
  # the corpus is the source of truth (SPEC D2); the app only reads it
  - "/root/levinrag/corpus:/app/corpus:ro"
